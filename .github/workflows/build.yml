name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Prepare SDK directory structure for buildozer
        run: |
          # 1. إنشاء المسار الذي يتوقعه buildozer بالضبط
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. نسخ أو ربط sdkmanager من cmdline-tools (الموجود في بيئة GitHub)
          # بيئة ubuntu-22.04 على GitHub Actions تحتوي عادةً على cmdline-tools في ANDROID_HOME
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            ln -sf $ANDROID_HOME/cmdline-tools/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            ln -sf $ANDROID_HOME/cmdline-tools/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
          fi
          
          # 3. التحقق من أن الرابط يعمل
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version || echo "sdkmanager not working yet"

      - name: Inject SDK licenses (in buildozer path)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapYTube-Pro-APK
          path: bin/*.apk
